<div class="w-[100%] h-screen bg-[#9efda4]">

<div class="text-center pt-10">
    <h1 class="text-3xl text-slate-700">Bienvenido</h1>
  </div>
  <div class="mt-6 mx-auto text-center flex flex-col items-center border-3 border-black rounded-md  bg-green-500 w-60 h-80 ">
    <h2 class="text-center mt-10 text-xl text-white">Ingresa tu nombre</h2>
    <input class="text-slate-600 w-32 text-center mt-10 border-2 border-e-violet-800 border-[#59785B]" type="text" [(ngModel)]="nombre"  placeholder="Nombre...">
    <button (click)="guardarNombre(nombre)" class="text-md hover:bg-[#415e43] text-white rounded-lg w-16 h-10 mt-4 border-2 bg-[#59785B] border-[#59785B] ">Entrar</button>
  </div>
</div>
